<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOMO Journey｜百歲人生配置系統</title>
<style>
  :root{
    --navy-deep:#081522;
    --navy:#0B1F33;
    --navy-card:#102B45;
    --green:#00A876;
    --green-soft:#5FD9AF;
    --white:#F4F7F6;
    --grey:#9FB3C2;
    --amber:#E8A458;
    --line:rgba(244,247,246,0.10);
    --serif:'Noto Serif TC','Source Han Serif TC','Georgia',serif;
    --sans:'Noto Sans TC','Helvetica Neue',Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    background:radial-gradient(circle at 20% -10%, #103450 0%, var(--navy-deep) 55%);
    color:var(--white);
    font-family:var(--sans);
    min-height:100%;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:var(--sans);}
  #app{
    max-width:780px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ---------- Timeline rail ---------- */
  .rail-wrap{
    position:sticky;
    top:0;
    z-index:20;
    background:linear-gradient(180deg, rgba(8,21,34,0.97) 70%, rgba(8,21,34,0));
    padding:18px 24px 28px;
  }
  .rail{ position:relative; height:34px; }
  .rail-line{
    position:absolute; top:50%; left:0; right:0; height:2px;
    background:var(--line); transform:translateY(-50%);
  }
  .rail-fill{
    position:absolute; top:50%; left:0; height:2px;
    background:var(--green); transform:translateY(-50%);
    transition:width .6s cubic-bezier(.4,0,.2,1);
  }
  .rail-dots{ position:relative; display:flex; justify-content:space-between; }
  .rail-dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--navy-card); border:1.5px solid var(--line);
    position:relative; transition:all .4s; flex-shrink:0;
  }
  .rail-dot.done{background:var(--green);border-color:var(--green);}
  .rail-dot.now{
    background:var(--navy-deep);border-color:var(--green-soft);
    box-shadow:0 0 0 4px rgba(95,217,175,0.18);width:12px;height:12px;
  }
  .rail-dot::after{
    content:attr(data-age);
    position:absolute; top:16px; left:50%; transform:translateX(-50%);
    font-size:9px; color:var(--grey); white-space:nowrap; letter-spacing:.02em;
    max-width:60px; text-align:center;
  }
  @media (max-width:600px){
    .rail-dot::after{ font-size:8px; }
  }

  /* ---------- Stage screens ---------- */
  .stage{
    flex:1; display:flex; flex-direction:column;
    padding:8px 28px 56px; animation:fadeUp .5s ease both;
  }
  @keyframes fadeUp{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }
  .stage-eyebrow{
    font-size:13px; color:var(--green-soft); letter-spacing:.12em;
    text-transform:uppercase; margin-top:18px;
  }
  .stage-age{
    font-family:var(--serif);
    font-size:clamp(32px,8.5vw,52px);
    line-height:1.15; margin-top:6px; font-weight:600;
  }
  .stage-age small{
    display:block; font-family:var(--sans); font-size:14px; font-weight:400;
    color:var(--grey); margin-top:6px; letter-spacing:.02em;
  }
  .stage-scene{
    margin-top:18px; border-radius:18px; overflow:hidden;
    border:1px solid var(--line); position:relative; min-height:140px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--navy-card), var(--navy));
  }
  .stage-scene .glyph{font-size:54px;filter:drop-shadow(0 6px 18px rgba(0,168,118,.25));}
  .stage-scene::before{
    content:''; position:absolute; inset:0;
    background:radial-gradient(circle at 70% 20%, rgba(0,168,118,0.16), transparent 60%);
  }
  .stage-question{
    margin-top:22px; font-family:var(--serif);
    font-size:19px; color:var(--white); font-weight:600; line-height:1.5;
  }
  .choices{ margin-top:24px; display:flex; flex-direction:column; gap:10px; }
  .choice{
    text-align:left; background:var(--navy-card); border:1px solid var(--line);
    border-radius:14px; padding:16px 18px; color:var(--white);
    font-family:var(--sans); font-size:15px; line-height:1.55; cursor:pointer;
    display:flex; gap:14px; align-items:flex-start;
    transition:border-color .2s, background .2s, transform .15s;
    width:100%;
  }
  .choice .tag{
    flex-shrink:0; width:26px; height:26px; border-radius:50%;
    border:1.5px solid var(--green); color:var(--green-soft);
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; margin-top:1px;
  }
  .choice:hover{ border-color:var(--green); background:#13334F; transform:translateY(-1px); }
  .choice:focus-visible{ outline:2px solid var(--green-soft); outline-offset:2px; }
  .choice .ctext .main{display:block;font-weight:600;}
  .choice .ctext .sub{display:block;color:var(--grey);font-size:13px;margin-top:4px;}

  /* ---------- Intro ---------- */
  .intro{
    flex:1; display:flex; flex-direction:column; justify-content:center;
    padding:60px 30px 50px; text-align:left;
  }
  .intro-eyebrow{
    color:var(--green-soft); font-size:13px; letter-spacing:.16em; text-transform:uppercase;
  }
  .intro h1{
    font-family:var(--serif); font-size:clamp(30px,8vw,48px);
    line-height:1.25; margin-top:14px; font-weight:600;
  }
  .intro h1 em{color:var(--green-soft);font-style:normal;}
  .intro p{
    margin-top:20px; font-size:15.5px; line-height:1.85; color:var(--grey); max-width:520px;
  }
  .intro .meta-list{
    margin-top:24px; display:flex; flex-direction:column; gap:8px;
  }
  .intro .meta-list li{
    font-size:13.5px; color:var(--grey); display:flex; gap:10px; align-items:baseline;
  }
  .intro .meta-list li b{color:var(--green-soft); font-weight:600; min-width:18px;}
  .intro .span-life{
    margin-top:30px; display:flex; align-items:center; gap:14px; color:var(--grey); font-size:13px;
  }
  .span-rail{flex:1;height:1px;background:var(--line);position:relative;}
  .span-rail::after{
    content:'';position:absolute;left:0;top:-3px;width:7px;height:7px;border-radius:50%;background:var(--green);
  }
  .span-rail::before{
    content:'';position:absolute;right:0;top:-3px;width:7px;height:7px;border-radius:50%;background:var(--green-soft);
  }
  .start-btn{
    margin-top:38px; align-self:flex-start; background:var(--green); color:#06281D;
    border:none; font-family:var(--sans); font-weight:700; font-size:16px;
    padding:15px 34px; border-radius:30px; cursor:pointer;
    transition:transform .15s, box-shadow .2s; box-shadow:0 8px 24px rgba(0,168,118,0.28);
  }
  .start-btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,168,118,0.4);}

  /* ---------- Results ---------- */
  .results{ flex:1; padding:10px 26px 60px; animation:fadeUp .6s ease both; }
  .res-hero{ text-align:center; padding:34px 10px 8px; }
  .res-eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey);}
  .res-glyph{font-size:58px;margin-top:14px;}
  .res-type{
    font-family:var(--serif); font-size:clamp(26px,6.5vw,36px);
    margin-top:10px; font-weight:600; color:var(--white);
  }
  .res-sub{ margin-top:10px; color:var(--green-soft); font-size:14px; line-height:1.7; max-width:480px; margin-left:auto; margin-right:auto; }
  .res-second{ margin-top:10px; color:var(--grey); font-size:13px; }
  .res-second b{ color:var(--white); font-weight:600; }

  .balance-card{
    margin-top:30px; background:var(--navy-card); border:1px solid var(--line);
    border-radius:18px; padding:26px; text-align:center;
  }
  .balance-label{
    font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--grey);
  }
  .balance-score{
    font-family:var(--serif); font-size:clamp(44px,12vw,64px); font-weight:700;
    margin-top:8px; color:var(--green-soft); line-height:1;
  }
  .balance-score span{font-size:.4em;color:var(--grey);font-weight:400;margin-left:4px;}
  .balance-bar{
    margin-top:18px; height:6px; border-radius:4px; background:rgba(244,247,246,0.08);
    overflow:hidden; position:relative;
  }
  .balance-bar-fill{
    height:100%; border-radius:4px;
    background:linear-gradient(90deg, var(--green), var(--green-soft));
    transition:width 1s cubic-bezier(.4,0,.2,1);
    width:0;
  }
  .balance-desc{
    margin-top:18px; font-size:13.5px; line-height:1.8; color:var(--white); text-align:left;
  }

  .section-label{
    font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--green-soft);
    margin-top:46px; margin-bottom:14px;
  }
  .card{
    background:var(--navy-card); border:1px solid var(--line); border-radius:16px; padding:22px;
  }
  .card + .card{ margin-top:16px; }
  .card-title{
    font-family:var(--serif); font-size:18px; font-weight:600; margin-bottom:14px; color:var(--white);
  }
  .card-body{ font-size:14px; line-height:1.85; color:var(--white); }
  .card-body p + p{ margin-top:10px; }
  .card-body .gap-compare{
    margin-top:14px; padding:12px 14px; background:rgba(232,164,88,0.08);
    border:1px solid rgba(232,164,88,0.3); border-radius:10px;
    font-size:13px; line-height:1.75; color:var(--grey);
  }
  .card-body .gap-compare b{ color:var(--amber); font-weight:600; }

  .wheel-wrap{display:flex;flex-direction:column;align-items:center;}
  .wheel-wrap svg{max-width:100%;}
  .wheel-legend{
    display:grid; grid-template-columns:1fr 1fr; gap:6px 18px;
    margin-top:18px; width:100%; font-size:12.5px; color:var(--grey);
  }
  .wheel-legend div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 0;}
  .wheel-legend b{color:var(--white);font-weight:600;}

  /* 任務清單卡 */
  .task-list{ display:flex; flex-direction:column; gap:12px; margin-top:4px; }
  .task-row{
    display:flex; gap:14px; align-items:flex-start; padding:14px 16px;
    background:var(--navy); border:1px solid var(--line); border-radius:12px;
  }
  .task-num{
    flex-shrink:0; width:30px; height:30px; border-radius:50%;
    background:rgba(0,168,118,0.15); border:1px solid var(--green);
    color:var(--green-soft); font-weight:700; font-size:13px;
    display:flex; align-items:center; justify-content:center;
  }
  .task-row b{ display:block; font-size:14.5px; color:var(--white); margin-bottom:4px; }
  .task-row span{ font-size:13px; color:var(--grey); line-height:1.6; }

  /* 國泰協助流程卡 */
  .plan-block{ margin-top:18px; }
  .plan-block:first-child{ margin-top:0; }
  .plan-goal{
    font-size:15px; font-weight:700; color:var(--green-soft);
    display:flex; align-items:center; gap:8px; margin-bottom:12px;
  }
  .plan-goal .gtag{
    font-size:10.5px; color:var(--amber); border:1px solid rgba(232,164,88,0.4);
    border-radius:10px; padding:2px 8px; font-weight:600; letter-spacing:.04em;
  }
  .plan-flow{
    display:flex; flex-direction:column; gap:0; border-left:2px solid var(--line);
    margin-left:6px; padding-left:18px;
  }
  .plan-step{ position:relative; padding:10px 0 16px; }
  .plan-step:last-child{ padding-bottom:2px; }
  .plan-step::before{
    content:''; position:absolute; left:-24px; top:14px; width:9px; height:9px;
    border-radius:50%; background:var(--navy-card); border:2px solid var(--green-soft);
  }
  .plan-step .step-label{
    font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--grey); margin-bottom:5px;
  }
  .plan-step .step-text{ font-size:13.5px; line-height:1.75; color:var(--white); }
  .tool-pills{ display:flex; flex-direction:column; gap:8px; margin-top:6px; }
  .tool-pill{
    background:rgba(0,168,118,0.08); border:1px solid rgba(0,168,118,0.25);
    border-radius:10px; padding:10px 14px;
  }
  .tool-pill b{ display:block; font-size:13.5px; color:var(--green-soft); margin-bottom:3px; }
  .tool-pill span{ font-size:12.5px; color:var(--grey); line-height:1.6; }

  .closing-quote{
    margin-top:38px; text-align:center; padding:28px 18px;
    border-top:1px solid var(--line); border-bottom:1px solid var(--line);
  }
  .closing-quote p{
    font-family:var(--serif); font-size:15.5px; line-height:1.9; color:var(--green-soft);
  }
  .next-checkup-list{ margin-top:14px; display:flex; flex-direction:column; gap:8px; }
  .next-checkup-list li{
    font-size:13.5px; color:var(--white); display:flex; gap:10px; align-items:baseline;
  }
  .next-checkup-list li b{ color:var(--green-soft); }

  .restart-btn{
    margin:46px auto 0; display:block; background:transparent; color:var(--green-soft);
    border:1px solid var(--green); font-family:var(--sans); font-weight:600;
    font-size:14px; padding:12px 28px; border-radius:24px; cursor:pointer; transition:background .2s;
  }
  .restart-btn:hover{ background:rgba(0,168,118,0.12); }

  .progress-hint{
    margin-top:22px; font-size:12px; color:var(--grey); text-align:right;
  }

  ::selection{ background:var(--green); color:#06281D; }
</style>
</head>

<div id="app"></div>

<script>
/* =========================================================
   資料模型
   ========================================================= */
const DIMENSIONS = [
  { key: 'finance',      label: '財務',     icon: '💰' },
  { key: 'career',       label: '事業',     icon: '📈' },
  { key: 'relationship', label: '關係',     icon: '🤝' },
  { key: 'health',       label: '健康',     icon: '🩺' },
  { key: 'education',    label: '教育',     icon: '🎓' },
  { key: 'spirit',       label: '精神',     icon: '🧘' },
  { key: 'service',      label: '服務',     icon: '🌱' },
  { key: 'growth',       label: '個人成長', icon: '🌟' },
];

const FOMO_TYPES = {
  wealth:      { label: '財富自由型', desc: '你最害怕錯過的，是財富累積與財務自由的機會。' },
  achievement: { label: '事業成就型', desc: '你最害怕錯過的，是發揮能力、成就職涯的舞台。' },
  family:      { label: '家庭守護型', desc: '你最害怕錯過的，是陪伴家人、守護家庭的時光。' },
  explore:     { label: '人生探索型', desc: '你最害怕錯過的，是探索世界、活出自我成長的機會。' },
  security:    { label: '安穩保障型', desc: '你最害怕錯過的，是未來面對風險時應有的保障與安全感。' },
  legacy:      { label: '價值傳承型', desc: '你最害怕錯過的，是讓努力留下長遠價值的機會。' },
  balanced:    { label: '全人均衡型', desc: '你害怕錯過的不是某一件事，而是讓人生因為過度傾斜某一面向而留下遺憾。' },
};

// 每個 FOMO 類型在八項指標中的「典型弱項」（結構性低權重，用於人格刻板印象敘事）
// 與下方計分權重對應：主項0.7 + 次項0.3，其餘列出最具代表性的2-3項典型弱項
const FOMO_TYPICAL_WEAK = {
  wealth:      ['relationship','health','service'],
  achievement: ['health','relationship','spirit'],
  family:      ['career','growth','finance'],
  explore:     ['finance','service','education'],
  security:    ['growth','spirit','service'],
  legacy:      ['health','career','growth'],
  balanced:    [], // 平衡型定義上沒有典型弱項
};

// 將八項指標分數先轉換為「全域分位數」(0~1)，再加權計算 FOMO 類型分數
// 這一步是關鍵：避免某些指標因為在七階段選項中出現頻率較高、權重較大，
// 而讓對應的 FOMO 類型結構性地一直勝出（例如原始設計中"財務"與"個人成長"曝光率明顯高於"服務"）
// 分位數查表：依七階段4^7=16384種組合，預先計算各維度分數分布後得出的近似切點
const DIM_QUANTILE_BREAKPOINTS = {
  finance:      [21,29,36,43,50,57,64,71,79,100],
  career:       [4,7,21,21,29,29,43,50,64,100],
  relationship: [7,21,21,29,36,43,43,50,64,100],
  health:       [7,7,14,14,21,21,29,36,43,71],
  education:    [4,4,7,7,14,21,21,29,36,64],
  spirit:       [14,21,29,36,36,43,50,57,64,100],
  service:      [4,4,7,21,21,21,21,29,43,43],
  growth:       [29,36,43,43,50,50,57,64,71,100],
};
function toQuantile(key, value){
  const bp = DIM_QUANTILE_BREAKPOINTS[key];
  let idx = bp.findIndex(b => value <= b);
  if (idx === -1) idx = bp.length - 1;
  return (idx + 1) / (bp.length + 1); // 約略落在 0~1 之間
}

// 將八項指標分數對應到 FOMO 類型的得分公式（主項0.7 + 次項0.3，已正規化為同一基準）
function computeFomoScores(scores){
  const q = {};
  Object.keys(scores).forEach(k => { q[k] = toQuantile(k, scores[k]); });
  return {
    wealth:      q.finance * 0.7 + q.career * 0.3,
    achievement: q.career * 0.7 + q.growth * 0.3,
    family:      q.relationship * 0.7 + q.health * 0.3,
    explore:     q.growth * 0.7 + q.spirit * 0.3,
    security:    q.health * 0.7 + q.finance * 0.3,
    legacy:      q.service * 0.7 + q.education * 0.3,
  };
}

const STAGES = [
  {
    id:1, key:'single', age:'單身規劃期', ageRange:'25–32歲', glyph:'🌱',
    choices:[
      { tag:'A', main:'錯過提早累積財富的黃金時間', sub:'擔心同齡人已開始投資，自己卻原地踏步',
        w:{ finance:3, career:1, growth:1 } },
      { tag:'B', main:'錯過認識更大世界的機會', sub:'想趁一人自由時多旅行、多嘗試，怕被工作綁住',
        w:{ growth:3, spirit:2, education:1 } },
      { tag:'C', main:'錯過在事業上衝刺的時機', sub:'怕現在不拚，未來就少了被看見的機會',
        w:{ career:3, finance:1, growth:1 } },
      { tag:'D', main:'錯過建立深刻關係的階段', sub:'怕太專注自己，反而錯過值得珍惜的人',
        w:{ relationship:3, spirit:1, growth:1 } },
    ],
  },
  {
    id:2, key:'newlywed', age:'新婚成家期', ageRange:'28–35歲', glyph:'💍',
    choices:[
      { tag:'A', main:'錯過與伴侶共同打造未來的默契', sub:'怕忙於工作，疏於經營這段剛起步的關係',
        w:{ relationship:3, spirit:2 } },
      { tag:'B', main:'錯過為家庭打好財務地基的時機', sub:'怕婚後開銷增加卻沒提早規劃，影響長期目標',
        w:{ finance:3, health:1, career:1 } },
      { tag:'C', main:'錯過兩人還能自由生活的階段', sub:'怕有了責任後，再也沒有現在這樣的自在',
        w:{ growth:3, relationship:1, spirit:1 } },
      { tag:'D', main:'錯過趁年輕衝事業的最後階段', sub:'怕成家後重心轉移，事業發展因此放緩',
        w:{ career:3, finance:1, growth:1 } },
    ],
  },
  {
    id:3, key:'dink', age:'頂客生活期', ageRange:'30–40歲', glyph:'🥂',
    choices:[
      { tag:'A', main:'錯過為自己累積資產的最佳窗口', sub:'雙薪無子的階段最適合投資，怕浪費這段時間',
        w:{ finance:3, health:1, growth:1 } },
      { tag:'B', main:'錯過深度體驗生活與世界的機會', sub:'怕日子過得太規律，錯過真正想做的事',
        w:{ growth:3, spirit:2, education:1 } },

/* =========================================================

   ========================================================= */
function renderRail(activeIdx, done){
  const total = STAGES.length;
  const pct = done ? 100 : (activeIdx / (total - 1)) * 100;
  const dots = STAGES.map((s, i) => {
    let cls = '';
    if (i < activeIdx || done) cls = 'done';
    else if (i === activeIdx) cls = 'now';
    return `<div class="rail-dot ${cls}" data-age="${s.age}"></div>`;
  }).join('');
  return `
    <div class="rail-wrap">
      <div class="rail">
        <div class="rail-line"></div>
        <div class="rail-fill" style="width:${pct}%"></div>
        <div class="rail-dots">${dots}</div>
      </div>
    </div>
  `;
}

/* =========================================================
   計分
   ========================================================= */
function computeScores(){
  const raw = {};
  DIMENSIONS.forEach(d => raw[d.key] = 0);
  state.answers.forEach(a => {
    Object.entries(a.w).forEach(([k, v]) => { raw[k] += v; });
  });
  // 正規化到 0-100（理論最大值假設約每維度可達 12 分上限抓寬鬆值 14）
  const maxPossible = 14;
  const normalized = {};
  DIMENSIONS.forEach(d => {
    normalized[d.key] = Math.max(4, Math.min(100, Math.round((raw[d.key] / maxPossible) * 100)));
  });
  return { raw, normalized };
}

function computeBalanceIndex(normalized){
  const vals = DIMENSIONS.map(d => normalized[d.key]);
  const mean = vals.reduce((a,b) => a+b, 0) / vals.length;
  const variance = vals.reduce((a,b) => a + Math.pow(b - mean, 2), 0) / vals.length;
  const sd = Math.sqrt(variance);
  // sd 越小代表越平衡 -> balance index 越高。sd 理論上限約 45，做映射
  const balance = Math.max(0, Math.min(100, Math.round(100 - (sd / 45) * 100)));
  return { balance, mean, sd };
}

// Balance Index 達到此門檻時，直接歸類為「全人均衡型」，不再比較6型分數
// 此門檻基於 7階段×4選項=4^7=16384 種組合的窮舉模擬校準：
// Balance>=75 約佔全體 1.86%，足夠稀有但不會稀有到使用者實際遇不到
const BALANCED_TYPE_THRESHOLD = 75;

function topFomo(normalized, balance){
  if (balance >= BALANCED_TYPE_THRESHOLD){
    return { primary: 'balanced', secondary: null, all: [], isBalanced: true };
  }
  const fomoScores = computeFomoScores(normalized);
  const sorted = Object.entries(fomoScores).sort((a,b) => b[1]-a[1]);
  return { primary: sorted[0][0], secondary: sorted[1][0], all: sorted, isBalanced: false };
}

function rankDimensions(normalized){
  return DIMENSIONS.map(d => ({ ...d, score: normalized[d.key] }))
    .sort((a,b) => b.score - a.score);
}

/* =========================================================
   雷達圖 SVG
   ========================================================= */
function renderRadarSVG(normalized){
  const size = 280;
  const center = size / 2;
  const maxR = 100;
  const n = DIMENSIONS.length;
  const angleStep = (Math.PI * 2) / n;

  function pointFor(i, value){
    const angle = -Math.PI/2 + i * angleStep;
    const r = (value / 100) * maxR;
    return [center + r * Math.cos(angle), center + r * Math.sin(angle)];
  }

  // grid rings
  const rings = [20,40,60,80,100].map(pct => {
    const pts = DIMENSIONS.map((_, i) => pointFor(i, pct).join(',')).join(' ');
    return `<polygon points="${pts}" fill="none" stroke="rgba(244,247,246,0.08)" stroke-width="1"/>`;
  }).join('');

  // axes
  const axes = DIMENSIONS.map((_, i) => {
    const [x,y] = pointFor(i, 100);
    return `<line x1="${center}" y1="${center}" x2="${x}" y2="${y}" stroke="rgba(244,247,246,0.10)" stroke-width="1"/>`;
  }).join('');

  // data polygon
  const dataPts = DIMENSIONS.map((d, i) => pointFor(i, normalized[d.key]).join(',')).join(' ');

  // labels
  const labels = DIMENSIONS.map((d, i) => {
    const [x,y] = pointFor(i, 122);
    return `<text x="${x}" y="${y}" font-size="11" fill="#9FB3C2" text-anchor="middle" dominant-baseline="middle">${d.label}</text>`;
  }).join('');

  return `
    <svg viewBox="0 0 ${size+50} ${size+50}" width="100%" height="auto" style="max-width:320px">
      <g transform="translate(25,25)">
        ${rings}
        ${axes}
        <polygon points="${dataPts}" fill="rgba(0,168,118,0.28)" stroke="#5FD9AF" stroke-width="2"/>
        ${labels}
      </g>
    </svg>
  `;
}

function buildHealthReport(normalized, ranked, primary, isBalanced){
  const top2 = ranked.slice(0,2);
  const bottom3 = ranked.slice(-3);
  const topText = top2.map(d => DIM_NARRATIVE[d.key].high).join('，');

  if (isBalanced){
    // 平衡型：不強行套用「缺口」敘事，改強調穩健與維持
    const bottomLight = bottom3.map(d => d.label).join('、');
    return `<p>你擁有${top2.map(d=>d.label).join('與')}方面的優勢——${topText}。</p>
    <p>更難得的是，你在八項人生指標上沒有明顯的失衡：即使${bottomLight}相對投入稍少，差距也不大。這是經過用心經營才會出現的狀態，建議在人生重大轉折（結婚、生子、退休）時定期回來檢視，讓這份平衡持續維持下去。</p>`;
  }

  const bottom2 = bottom3.slice(-2);
  const bottomText = bottom2.map(d => DIM_NARRATIVE[d.key].low).join('；');
  const typicalWeak = FOMO_TYPICAL_WEAK[primary] || [];
  const actualGapKeys = bottom2.map(d => d.key);
  const validated = typicalWeak.filter(k => actualGapKeys.includes(k));
  const surprise = actualGapKeys.filter(k => !typicalWeak.includes(k));

  let compareText = '';
  if (validated.length > 0 && surprise.length > 0){
    const vLabel = validated.map(k => DIMENSIONS.find(d=>d.key===k).label).join('、');
    const sLabel = surprise.map(k => DIMENSIONS.find(d=>d.key===k).label).join('、');
    compareText = `<p class="gap-compare">身為「${FOMO_TYPES[primary].label}」的人，通常容易忽略<b>${vLabel}</b>——你的實測結果驗證了這個傾向。同時，系統也發現你在<b>${sLabel}</b>的投入比同類型的人更低，這是你個人獨有的隱藏缺口，值得特別留意。</p>`;
  } else if (validated.length > 0){
    const vLabel = validated.map(k => DIMENSIONS.find(d=>d.key===k).label).join('、');
    compareText = `<p class="gap-compare">身為「${FOMO_TYPES[primary].label}」的人，通常容易忽略<b>${vLabel}</b>——你的實測結果也驗證了這個傾向。</p>`;
  } else if (surprise.length > 0){
    const sLabel = surprise.map(k => DIMENSIONS.find(d=>d.key===k).label).join('、');
    compareText = `<p class="gap-compare">有趣的是，你在<b>${sLabel}</b>的投入比一般「${FOMO_TYPES[primary].label}」的人更低，這是屬於你個人的隱藏缺口。</p>`;
  }

  return `<p>你擁有${top2.map(d=>d.label).join('與')}方面的優勢——${topText}。</p>
  <p>不過，${bottom2.map(d=>d.label).join('及')}的投入相對不足：${bottomText}。長期來看，這些缺口可能影響你百歲人生的整體品質與安心感。</p>
  ${compareText}`;
}

      { name: '投資型保單', desc: '結合保障與投資，依風險屬性彈性配置資產。' },
      { name: '全球資產配置', desc: '分散單一市場風險，提升長期資產成長的穩定性。' },
    ],
  },
  service: {
    goal: '財富傳承與人生貢獻', gtag: '傳承缺口',
    purpose: '讓資產依照自己的意願傳承，同時延續人生的影響力。',
    reasonTpl: (label) => `你重視${label}，但若缺乏提早規劃，資產傳承與分配可能無法完全依照心意進行。`,
    tools: [

      { name: '財產傳承信託', desc: '依個人意願規劃資產分配方式，降低家庭爭議。' },
    ],

    purpose: '降低長照及失能風險，維持百歲人生的生活自主性。',
    reasonTpl: (label) => `百歲人生需要提前規劃健康照護，目前${label}方面的準備仍可以更完整。`,
    tools: [
      { name: '長照險', desc: '應對長期照護需求，減輕家庭照顧壓力。' },
      { name: '失能保障', desc: '針對失能風險提供生活與醫療支出補貼。' },
    ],
  },
  career:    { alias: 'finance' },
  education: { alias: 'finance' },
  spirit:    { alias: 'service' },
};

function buildCathayPlans(ranked){
  const gaps = ranked.slice(-3).reverse(); // 最缺乏的三項
  const usedGoals = new Set();
  const plans = [];
  for (const g of gaps){
    let key = g.key;
    let plan = CATHAY_PLANS[key];
    if (plan && plan.alias) plan = CATHAY_PLANS[plan.alias];
    if (!plan || usedGoals.has(plan.goal)) continue;
    usedGoals.add(plan.goal);
    plans.push({ ...plan, reason: plan.reasonTpl(g.label) });
    if (plans.length >= 3) break;
  }
  // 最多 2-3 個規劃
  return plans.slice(0, plans.length > 2 ? 3 : plans.length);
}

/* =========================================================
   渲染：Results
   ========================================================= */
function renderResults(){
  const { normalized } = computeScores();
  const { balance } = computeBalanceIndex(normalized);
  const ranked = rankDimensions(normalized);
  const { primary, secondary, isBalanced } = topFomo(normalized, balance);
  const primaryType = FOMO_TYPES[primary];
  const secondaryType = secondary ? FOMO_TYPES[secondary] : null;

  const legendHtml = DIMENSIONS.map(d => `
    <div><span>${d.icon} ${d.label}</span><b>${normalized[d.key]}</b></div>
  `).join('');

  const tasks = buildTenYearTasks(ranked);

    <div class="task-row">
      <div class="task-num">${i+1}</div>

  const plans = buildCathayPlans(ranked);

          <div class="step-text">${p.purpose}</div>

          <div class="step-text">${p.reason}</div>
        </div>

          <div class="step-text">
            <div class="tool-pills">
              ${p.tools.map(t => `<div class="tool-pill"><b>${t.name}</b><span>${t.desc}</span></div>`).join('')}
            </div>
          </div>
        </div>
      </div>
    </div>
  `).join('');

  root.innerHTML = `
    ${renderRail(STAGES.length - 1, true)}
    <div class="results">

      <div class="res-hero">
        <div class="res-eyebrow">你的核心 FOMO</div>
        <div class="res-type">${primaryType.label}</div>
        <div class="res-sub">${primaryType.desc}</div>
        <div class="res-second">${secondaryType ? `次要 FOMO：<b>${secondaryType.label}</b>` : '你的人生指標分布均衡，沒有明顯次要傾向'}</div>
      </div>

      <div class="balance-card">
        <div class="balance-label">Balance Index 人生平衡指數</div>
        <div class="balance-score">${balance}<span>/ 100</span></div>
        <div class="balance-bar"><div class="balance-bar-fill" id="balanceFill" style="width:0%"></div></div>
        <div class="balance-desc">${buildBalanceDesc(ranked, balance)}</div>
      </div>

      <div class="section-label">人生八軸雷達圖</div>
      <div class="card wheel-wrap">
        ${renderRadarSVG(normalized)}
        <div class="wheel-legend">${legendHtml}</div>
      </div>

      <div class="section-label">第一張卡片・人生健診報告</div>
      <div class="card">
        <div class="card-title">你目前的人生狀態</div>
        <div class="card-body">${buildHealthReport(normalized, ranked, primary, isBalanced)}</div>
      </div>

      <div class="section-label">第二張卡片・未來十年人生任務</div>
      <div class="card">
        <div class="card-title">現階段最重要的三件事</div>
        <div class="task-list">${taskHtml}</div>
      </div>

      <div class="section-label">第三張卡片・國泰如何協助</div>
      <div class="card">
        <div class="card-title">依你的人生缺口，量身規劃</div>
        ${planHtml}
      </div>

      <div class="closing-quote">
        <p>FOMO 告訴你今天最害怕失去什麼；國泰陪你規劃未來，讓百歲人生少一點遺憾，多一點從容。</p>
      </div>

      <div class="section-label">下一次人生健診</div>
      <div class="card">
        <div class="card-body">
          <p>人生每一個階段，害怕錯過的事情都可能改變。建議於以下時刻，重新進行 FOMO Journey，讓人生規劃持續更新：</p>
          <ul class="next-checkup-list">
            <li><b>・</b>結婚時</li>
            <li><b>・</b>成為父母時</li>
            <li><b>・</b>退休時</li>
            <li><b>・</b>或人生重大轉變時</li>
          </ul>
        </div>
      </div>

      <button class="restart-btn" id="restartBtn">重新進行 FOMO Journey</button>
    </div>
  `;

  requestAnimationFrame(() => {
    const fill = document.getElementById('balanceFill');
    if (fill) fill.style.width = balance + '%';
  });

  document.getElementById('restartBtn').addEventListener('click', () => {
    state.screen = 'intro';
    state.stageIndex = 0;
    state.answers = [];
    renderIntro();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

renderIntro();
</script>
